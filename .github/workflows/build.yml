name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - name: Zola build
        run: |
          git submodule init
          git submodule update 
          zola build

